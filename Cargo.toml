[package]
name = "halcyon-lib"
version = "2026.2.11"
authors = ["Logan Gatlin <logan@gatlintc.com>"]
edition = "2024"
# rust-version = ""
description = "Compiler backend for the Halcyon programming language"
readme = "./README.md"
homepage = "https://halcyon-lang.dev"
repository = "https://github.com/logan-gatlin/halcyon"
license = "MIT"
keywords = ["compiler", "functional programming", "wasm"]
categories = ["wasm", "compiler"]

[dependencies]
wasm-encoder = "0.233"
punycode = "0.4"
wasm-bindgen = "0.2"
multipeek = "0.1"
toml = {version = "0.9", default-features = false, features = ["parse", "serde"]}
indexmap = "2.11"
wasmparser = {version = "0.235"}
wasmprinter = "0.235"
colored = "3"
codespan-reporting = { version = "0.13", features = ["termcolor"] }
indoc = "2"
unicode_names2 = "2"
derive-new = "0.5"
paste = "1"
enum-iterator = "2.3"
rowan = "0.16"

[dev-dependencies]
wasmtime = { version = "34.0", features = ["runtime", "cranelift", "gc", "gc-drc"] }
wasmtime-wasi = { version = "34.0", features = ["preview1"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[lib]
crate-type = ["cdylib", "lib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "-O2"]

