name: Build Wasm NPM Package

on:
  workflow_dispatch:
  push:
    branches:
      - stable

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version_triple: ${{ steps.version.outputs.version_triple }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version triple
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          version = cargo["package"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_triple={version}\n")
          PY

  wasm-npm-package:
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build wasm-bindgen package for npm bundlers
        run: wasm-pack build --release --target bundler --out-dir pkg/npm

      - name: Create npm tarball
        run: npm pack
        working-directory: pkg/npm

      - name: Upload generated npm package directory
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-npm-package
          path: pkg/npm

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-npm-tarball
          path: pkg/npm/*.tgz

  cli-binaries:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: halcyon
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: halcyon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: halcyon.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build CLI binary
        run: cargo build --release -p halcyon --target ${{ matrix.target }}

      - name: Package CLI binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          archive_name="halcyon-${{ needs.resolve-version.outputs.version_triple }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          tar -czf "dist/${archive_name}" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"

      - name: Package CLI binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archiveName = "halcyon-${{ needs.resolve-version.outputs.version_triple }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -DestinationPath "dist/$archiveName" -Force

      - name: Upload CLI binary archive
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-cli-${{ matrix.target }}
          path: dist/*

  publish-release:
    needs:
      - resolve-version
      - wasm-npm-package
      - cli-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Download npm tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: halcyon-npm-tarball
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: halcyon-cli-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-${{ needs.resolve-version.outputs.version_triple }}
          name: Stable Release (${{ needs.resolve-version.outputs.version_triple }})
          body: |
            Automated stable release for version `${{ needs.resolve-version.outputs.version_triple }}`.
            Commit: `${{ github.sha }}`
          files: release-assets/*
